# AEMS Named Zones Configuration
# Arena coordinates: -10m to +10m x and y
# Each zone defines:
#   bounds: [min_x, max_x, min_y, max_y]
#   center: [x, y]
#   standoff: [x, y, yaw_rad]
#   description: Human-readable location description
#   aliases: Natural language aliases / synonyms

zones:
  vehicle_bay:
    bounds: [-10.0, -3.0, 3.0, 10.0]
    center: [-7.0, 7.0]
    standoff: [-5.5, 5.5, 2.35]
    description: "Northwest zone containing the SUV and vehicle service bay"
    aliases:
      - "vehicle bay"
      - "car bay"
      - "garage"
      - "parking area"
